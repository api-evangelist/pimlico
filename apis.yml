apis:
- name: Pimlico Bundler & Paymaster API
  description: >-
    Unified ERC-4337 JSON-RPC endpoint exposing both the Pimlico bundler
    (eth_sendUserOperation, eth_estimateUserOperationGas,
    eth_getUserOperationReceipt, pimlico_getUserOperationGasPrice,
    pimlico_getUserOperationStatus) and paymaster (pm_sponsorUserOperation,
    pm_getPaymasterData, pm_getPaymasterStubData, ERC-20 token quotes) methods,
    addressed per chain and authenticated with an API key query parameter.
  humanURL: https://docs.pimlico.io/references/bundler
  baseURL: https://api.pimlico.io
  properties:
  - type: APIReference
    url: https://docs.pimlico.io/references/bundler
  - type: Documentation
    url: https://docs.pimlico.io
- name: Pimlico Platform API
  description: >-
    REST management API for the Pimlico platform used to create, list,
    retrieve, and update sponsorship policies that govern which user operations
    are eligible for gas sponsorship. Uses cursor pagination
    (limit/starting_after/ending_before).
  humanURL: https://docs.pimlico.io/references/platform
  baseURL: https://api.pimlico.io
  properties:
  - type: APIReference
    url: https://docs.pimlico.io/references/platform/api/sponsorship-policies
  - type: Documentation
    url: https://docs.pimlico.io/references/platform
