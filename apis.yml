aid: pimlico
name: Pimlico
description: >-
  Pimlico is the world's most popular ERC-4337 account abstraction
  infrastructure platform, providing production bundler and paymaster APIs plus
  a platform management API for building, deploying, and operating smart
  accounts on Ethereum and 100+ EVM-compatible chains. Its verifying paymaster
  sponsors gas for gasless transactions, its ERC-20 paymaster lets users pay gas
  in stablecoins and other tokens, and its bundler submits, estimates, and
  tracks ERC-4337 user operations. Developers integrate through the
  permissionless.js TypeScript SDK (built on viem) against a single JSON-RPC
  endpoint keyed by chain, and manage sponsorship policies, API keys, and
  billing through the Pimlico dashboard.
